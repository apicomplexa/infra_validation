# Analysis parameters — WHAT to analyse. Validated against
# workflow/schemas/config.schema.yaml; keys are described in config/README.md.
# HOW to run (cores, memory, cluster) lives in workflow/profiles/.

# One row per delivery file to check; validated against
# workflow/schemas/deliveries.schema.yaml. Its `delivery` column is the
# {delivery} wildcard, its `category` picks a block of `categories:` below.
deliveries: config/deliveries.tsv

# Snakemake pathvars: write "<results>/x.tsv" in rules instead of hard-coding
# directories. Values may reference other pathvars.
pathvars:
  data_raw: data/raw
  temp: data/temp
  resources: resources
  results: results
  reports: <results>/reports
  figures: <results>/figures
  logs: logs

# Snapshots and caches the checks read. Read-only for the main DAG; only the
# download tasks and `pixi run yandex-fetch` write here.
resources:
  egais_zip: resources/egais/data-20260701t0000-structure-20190918t0000.zip
  overture: resources/overture/overture_places_2026-10-21.0.parquet
  foursquare: resources/foursquare/fsq_places_2026-10-15.parquet
  yandex_cache:
    final: resources/cache/yandex/final_yandex_cache.jsonl
    v4: resources/cache/yandex/v4_yandex_cache.jsonl

notify:
  telegram: false # see workflow/rules/notify.smk

# --------------------------------------------------------------------------
# Categories. Everything that changes a verdict lives here: every threshold of
# every check (`policy`, one block per check, keys = the fields of that check's
# Policy dataclass), the independence table, the counting rule, the clause
# order of «Основания», the «Вид?» vocabulary and every Russian text of the
# deliverable. src/infracheck/categories/base.py applies it and holds no
# category-specific code.
# --------------------------------------------------------------------------
categories:
  catering:
    # Checks run for this category: one rule and one Evidence file each, and
    # the order the evidence columns are built in.
    checks: [providers, arkh_admin, export_name, yandex, overture, foursquare, egais]
    # Which Yandex cache (key of resources.yandex_cache) our query reads.
    yandex_cache: final

    policy:
      providers: &providers
        relink_m: 50.0
        relink_generic_m: 20.0
        name_min: 72.0
      arkh_admin:
        label: "Администрация"
        text: "в реестре (Arkh_admin = 1)"
      export_name: &export_name
        descriptor_label: "2GIS, описание в названии"
        bare_label: "название"
        separator: ","
      yandex:
        near_m: 150.0
        generic_m: 60.0
        name_min: 72.0
        contractor_status_found: "Найдено"
        # Names the category's trade, so it is a category text.
        contractor_miss_text: "по адресу есть общепит, но с другим названием"
        label: "Яндекс"
        label_contractor_miss: "Яндекс (подрядчик)"
      overture: &overture
        conf_min: 0.5
        name_min: 85.0
        near_m: 150.0
        generic_m: 60.0
        relink_m: 50.0
      foursquare: &foursquare
        fresh: "2022-01-01"
        name_min: 85.0
        near_m: 150.0
        generic_m: 60.0
        relink_m: 50.0
      # The registry join (checks/egais.py -> licmatch.match). `mode` picks the
      # check's rule (kinds, explanation ladder, exclusivity are its code);
      # `params` are licmatch.MatchParams, the rest the rule's switches.
      egais:
        mode: catering
        require_in_force: true
        name_policy: required # the name must agree, always: malls, hotels, food courts
        name_fields: [holder, venue] # holder, or the venue the registry writes into the address
        unit: [street, house, venue] # one outlet = holder @ address @ named venue
        params: &licmatch_params
          w_addr: 0.50
          w_name: 0.20
          w_dist: 0.30
          max_m: 100.0
          accept: 0.45
          addr_min: 0.72 # the address floor: the neighbouring building fails here
          addr_route_street: 0.90
          addr_route_house: 0.85
          strong: 0.75
          neutral_generic: true

    existence:
      min_sources: 2
      # The default rule of the three axes: this object, current.
      count:
        identity: [strong]
        record_state: [current]
      # Sources that never count for existence: the export's own name only
      # describes the object's kind.
      never_count: [export]
      # Independence groups, in the order of «Источники» and «Основания».
      # Yandex is one source however reached; its clause puts our own query
      # before the contractor's hit (`checks`).
      groups:
        - {label: "OSM", column: src_osm, sources: [osm]}
        - {label: "2GIS", column: src_gis, sources: [2gis]}
        - {label: "Яндекс", column: src_yandex, sources: [yandex], checks: [yandex, yandex_contractor]}
        - {label: "Overture", column: src_overture, sources: [overture]}
        - {label: "Foursquare", column: src_fsq, sources: [fsq]}
        - {label: "Администрация", column: src_arkh, sources: [arkh_admin]}
        - {label: "ЕГАИС", column: src_egais, sources: [egais]}
      # Records an aggregator built only from another group's source. An
      # Overture place whose datasets are Foursquare alone ("Foursquare|Overture")
      # is Foursquare, which counts under its own freshness rule (FSQ direct),
      # never as a second source beside it. Fixed 2026-10-30: the archive compared
      # the whole string with "foursquare" and never matched
      # (docs/changes/2026-10-30-overture-fsq-and-food-column.md).
      exclude:
        - {source: overture, only: [foursquare], ignore: [overture], sep: "|"}

    reasons:
      pro_sep: " | "
      group_sep: "; "
      con_intro: " || против/не найдено: "
      con_sep: "; "
      no_sources: "источников нет"
      # Order of the not-counted clauses, by check.
      con_order: [yandex_contractor, yandex, egais, overture, foursquare]

    # Which objects our own Yandex query could still decide (`pixi run yandex-fetch`).
    query:
      group: "Яндекс"
      column: needs_yandex
      skip_checks: [yandex_contractor]

    # «Яндекс: как засчитан».
    how:
      column: yandex_how
      sep: "; "
      parts:
        - check: yandex_contractor
          key: identity
          texts: {strong: "подрядчик: имя совпало", weak: "подрядчик: только адрес+категория"}
        - check: yandex
          key: yandex_status
          texts:
            present: "наша проверка: есть"
            closed: "наша проверка: закрыт"
            ambiguous: "наша проверка: не опознан"
            absent: "наша проверка: нет"
            error: "наша проверка: ошибка"

    # Extra columns of the decided table: Python expressions over its columns.
    derived:
      ya_closed: "ya_status == 'closed'"

    # One sign recorded twice is one object: the relink twin a provider was
    # lent from is the contractor's own missed merge. Per-record verdicts stay;
    # the summary counts merged objects (records in brackets), and the
    # deliverable names each row's merged object («Объект (склеен)»).
    # Since 2026-10-30 (docs/changes/2026-11-21-merged-objects.md).
    merge:
      column: merged
      pairs: [{check: relink, field: relink_object}]
      disagree: "; у {n} склеенных объектов решение объекта отличается от решения хотя бы одной записи"

    # «Общепит?» -- is the object catering at all. Four descriptions of the
    # object's kind, none of them the contractor's class.
    kind:
      column: food
      reasons_column: food_reasons
      # The three-axes default: only records that are this object vote. Until
      # 2026-10-30 weak FSQ / Overture records (won by a neighbouring object,
      # `exclusive`) voted too, as in the archive
      # (docs/changes/2026-11-21-merged-objects.md).
      vote_identity: [strong]
      votes: # order = order in «Общепит: основания»
        - {scheme: ru_text, checks: [export_name], keep_empty: true}
        - {scheme: yandex_rubric, label: "Яндекс, рубрика"}
        - {scheme: fsq_category}
        - {scheme: overture_category}
      words: {"yes": "да", "no": "нет", vending: "автомат", conflict: "противоречие", none: "нет данных"}
      schemes:
        # ORDER IS THE RULE: vending first, then what names food without being
        # a place to eat (wholesale, kitchen kit; «кафедра» starts with «кафе»),
        # then catering words, then shop/company words. «Служба доставки» is
        # neutral: in this class it is sushi and pizza.
        ru_text: &ru_ladder
          lower: true
          ladder:
            - [vending, 'автомат|кофемат|вендинг|кофемашин']
            - ["no", 'оптом|оптов|оборудовани|кафедр|собор|храм|церк']
            - - "yes"
              - 'кафе(?!др)|кофе|ресторан|столов|\bбар|бар\b|паб\b|пекарн|кулинари|кондитерская|бистро|пиццер|бургер|шаурм|шаверм|суши|роллы|закусоч|буфет|фуд-?трак|чайхан|банкетн|доставки еды|быстрого питания|общественного питания|кейтеринг|гриль|рюмочн|пельмен|блин|чебуреч|трактир|харчевн|донер|хинкал|пирожк|кухня|гастро|лаундж|кальянн|таверн|шашлык|хот-?дог|банкет|coffee|cafe|pizza|grill|sushi|burger|bakery|kitchen|\bbar\b|\bpub\b'
            - - "no"
              - 'магазин|маркет|гипермаркет|компани|организаци|мастерская|студи|торговый дом|салон|\bцентр\b|клуб|склад|\bбаза\b|представительств|ателье|аптек|офис|агентств|бюро|фирма|завод|производств|оптов|бутик|отдел|ларёк|киоск печати|гостиниц|хостел|отель|школа|сервис|товары|продукты|продукция|курсы|мастер-класс'
        # Yandex's rubric is Russian text read with the same ladder.
        yandex_rubric: *ru_ladder
        fsq_category:
          split: "|"
          any_yes: '^Dining and Drinking|Cafeteria|Restaurant|Caf[eé]|Bar\b'
          all_no_top: [Retail, Business and Professional Services, Health and Medicine, Community and Government]
          top_sep: " > "
        overture_category:
          lower: false
          ladder:
            - - "yes"
              - 'restaurant|cafe|coffee|\bbar\b|_bar|pub|bakery|cafeteria|food|pizza|lounge|buffet|tea_room|bistro|diner|deli|brewery|canteen|dessert|ice_cream|caterer'
            - - "no"
              - 'store|shop|mall|market|company|service|office|agency|contractor|supplier|wholesale|repair|salon|school|bank|clinic|pharmacy'

    # The deliverable: a copy of the delivered workbook.
    deliver:
      suffix: "_подтверждено"
      sheet: data
      legend_sheet: "Подтверждение"
      # Columns put in front of the contractor's, in this order.
      front:
        - {title: "Подтверждено", column: confirmed, width: 14}
        - {title: "Основания", column: reasons, width: 70}
        # Filled since 2026-10-30; the archive wrote the header only
        # (docs/changes/2026-10-30-overture-fsq-and-food-column.md).
        - {title: "Общепит?", column: food, width: 14}
      appended_width: 22
      # Columns appended after the contractor's: [title, decided-table column].
      appended:
        - ["Источников", n_sources]
        - ["Источники", sources]
        - ["Общепит: основания", food_reasons]
        - ["Яндекс: как засчитан", yandex_how]
        - ["Яндекс (наша): статус", ya_status]
        - ["Яндекс (наша): название", ya_name]
        - ["Яндекс (наша): адрес", ya_address]
        - ["Яндекс (наша): карточка", ya_url]
        - ["Яндекс (наша): расстояние, м", ya_distance_m]
        - ["Яндекс (наша): рядом", ya_nearby]
        - ["Яндекс (наша): запрос", ya_search_url]
        - ["Яндекс (наша): дата", ya_checked]
        - ["Связанная запись", link_note]
        - ["ЕГАИС: лицензия", egais_licence_no]
        - ["ЕГАИС: владелец", egais_holder]
        - ["ЕГАИС: пояснение", egais_note]
        - ["Overture: название", ov_name]
        - ["Overture: источник", ov_dataset]
        - ["Overture: расстояние, м", ov_distance_m]
        - ["Overture: пояснение", ov_note]
        - ["Foursquare: название", fsq_name]
        - ["Foursquare: обновлено", fsq_refreshed]
        - ["Foursquare: расстояние, м", fsq_distance_m]
        - ["Foursquare: пояснение", fsq_note]
        - ["Объект №", entity]
        - ["Строк у объекта", n_rows]
        - ["Объект (склеен)", merged]
        - ["Подтверждено (объект)", confirmed_object]
      # «Как читать». Placeholders are str.format fields over the Policies
      # actually used ({providers.relink_m:.0f}, {foursquare.fresh:.4}, ...),
      # {min_sources} and {min_sources_genitive}; no threshold is written out.
      legend:
        - - "Подтверждено"
          - "1 — о существовании объекта говорят не менее {min_sources_genitive} независимых источников; 0 — меньше {min_sources_genitive}."
        - - "Основания"
          - "По каждому засчитанному источнику — где найден объект: ссылка на запись OSM / карточку 2GIS, карточка Яндекса с адресом и способом проверки, соседняя запись, давшая провайдера, лицензия ЕГАИС. Источники разделены « | ». После « || против/не найдено:» — что искали и не нашли (куда копать дальше)."
        - - "Что такое объект"
          - "Одна вывеска в одной точке (название + координата). Выгрузка повторяет объект под каждым типом (кафе, ресторан, столовая…), поэтому источники считаются по объекту, а вердикт пишется во все его строки. Если подрядчик записал одну вывеску дважды (запись OSM и запись 2GIS рядом с тем же именем, см. «Связанная запись»), обе записи — один объект: «Объект (склеен)» — наименьший «Объект №» среди них. Вердикт у каждой записи свой; «Подтверждено (объект)» объединяет свидетельства всех записей и применяется в итогах (в скобках — записи)."
        - - "Источники"
          - "OSM, 2GIS, Яндекс Карты, реестр администрации (колонка Arkh_admin, когда заполнена), Overture Maps Places (Meta / AllThePlaces, без OSM), Foursquare OS Places, лицензия ЕГАИС на общепит у самого объекта (когда сверка с реестром выполнена). Яндекс засчитывается один раз, как бы он ни был получен."
        - - "OSM / 2GIS"
          - "Флаги OSM и GIS листа data, объединённые по строкам объекта. Если у объекта нет провайдера, но в пределах {providers.relink_m:.0f} м ({providers.relink_generic_m:.0f} м для безымянной вывески) стоит запись другого провайдера с тем же именем, провайдер засчитывается — это пропущенная подрядчиком склейка; колонка «Связанная запись» называет эту запись."
        - - "Яндекс: подрядчик"
          - "«Найдено» подрядчика означает совпадение адреса и категории, а не объекта. Оно засчитывается, только если одно из имён в «Яндекс: название» совпадает с именем объекта (сходство ≥ {yandex.name_min:.0f})."
        - - "Яндекс: наша проверка"
          - "Запрос «название, город, адрес» с картой по координате объекта. Есть — организация с похожим именем в пределах {yandex.near_m:.0f} м ({yandex.generic_m:.0f} м для безымянной вывески). Закрыт — Яндекс пишет «Больше не работает»; не засчитывается. Не опознан — по адресу кто-то есть, но безымянная вывеска не позволяет сказать кто. Пусто — объект не запрашивался (его вердикт не зависел от Яндекса)."
        - - "ЕГАИС"
          - "Реестр лицензий ФСРАР (снимок 2026-07-01). Засчитывается только действующая лицензия общепита у самого объекта: адрес проходит оба порога licmatch и имя совпадает с владельцем или с названием заведения в адресе лицензии. Один адрес без имени не засчитывается (ТЦ, гостиницы, фудкорты). Колонки «ЕГАИС: лицензия / владелец» у неподтверждённых объектов описывают лицензию, о которой говорит пояснение, — читайте «Подтверждено», а не наличие номера."
        - - "Overture"
          - "Открытый слой мест Overture Maps (снимок релиза в resources/overture). Засчитывается место с похожим (сходство ≥ {overture.name_min:.0f}) именем в пределах {overture.near_m:.0f} м ({overture.generic_m:.0f} м для безымянной вывески) и уверенностью Overture ≥ {overture.conf_min}. Записи Meta — страницы Facebook, в России не обновляются с 2022 г.: это слабее, чем сайт сети (AllThePlaces). Место Overture, собранное только из Foursquare, засчитывается как Foursquare, а не как второй источник. Одна запись Overture или Foursquare подтверждает одну точку: если на неё претендуют несколько объектов, она достаётся ближайшему и объектам в пределах {overture.relink_m:.0f} м от него (дубли выгрузки), остальным — нет (колонки «… пояснение»)."
        - - "Foursquare"
          - "Foursquare OS Places напрямую (снимок релиза в resources/foursquare). Сопоставление как у Overture (сходство имени ≥ {foursquare.name_min:.0f}). Засчитывается только запись, обновлённая с {foursquare.fresh:.4} г. и без даты закрытия: большинство записей по этим городам не обновлялось с 2013–2016 гг. и говорит лишь о том, что объект был тогда. Старые и закрытые совпадения показаны в «Основаниях» после « || » и в колонке «Foursquare: пояснение»."
        - - "Общепит?"
          - "Похож ли объект на общепит, по описаниям, которые не зависят от класса выгрузки: описание 2GIS после запятой в названии (или само название), рубрика Яндекса у той же карточки, категория Foursquare, категория Overture. да — все высказавшиеся источники за общепит; нет — все против (магазин, компания, проектная организация, опт, гостиница…); противоречие — источники расходятся (фирменный магазин пекарни, кафе при гостинице); автомат — кофейный или иной автомат; нет данных — по имени и источникам вид не определить. Это пометка для отбраковки, а не удаление: «нет» и «противоречие» стоит просмотреть, колонка «Общепит: основания» показывает, кто что сказал."
        - - "Чего нельзя утверждать"
          - "Подтверждено = 1 не означает, что объект работает сегодня и что он относится к этому типу. Подтверждено = 0 не означает, что объекта нет: это очередь для ручной проверки. Яндекс-проверка — снимок на дату в колонке."

    # «Итоги» of the legend sheet and of the summary file. `count` is a
    # boolean expression over the decided table (see config/README.md).
    combinations_title: "Источники объекта (комбинации):"
    summary:
      - {label: "Строк", value: rows}
      - {label: "Объектов (уникальных вывесок в точке)", value: objects}
      - {label: "Подтверждено объектов", value: confirmed_objects}
      - {label: "Подтверждено строк", value: confirmed_rows}
      - {label: "— из них только OSM + 2GIS подрядчика", count: "osm & gis"}
      - label: "— добавлено склейкой соседних записей"
        count: "confirmed.astype(bool) & ~(osm & gis) & (osm_link | gis_link)"
      - label: "— добавлено Яндексом"
        count: "confirmed.astype(bool) & src_yandex & ((src_osm.astype(int) + src_gis.astype(int) + src_arkh.astype(int)) < min_sources)"
      - {label: "«Найдено» подрядчика, отклонено по имени (объектов)", count: "ya_contractor_raw & ~ya_contractor"}
      - {label: "Наша Яндекс-проверка: запрошено объектов", count: "ya_status != ''"}
      - {for: [present, closed, ambiguous, absent, error], label: "   {}", count: "ya_status == '{}'"}
      - {label: "Найдено в Overture (объектов)", count: "ov_match"}
      - label: "Foursquare: засчитано / найдено, но старое или закрыто (объектов)"
        counts: ["src_fsq", "(fsq_name != '') & ~src_fsq"]
      - {for: ["да", "нет", "противоречие", "автомат", "нет данных"], label: "Общепит? — {} (объектов)", count: "food == '{}'"}
      - {label: "Своя лицензия общепита в ЕГАИС (объектов)", count: "src_egais"}
      - {label: "Подтверждено, но Яндекс пишет «закрыт»", count: "confirmed.astype(bool) & ya_closed"}
      - {label: "Не запрошено, хотя вердикт зависит от Яндекса", count: "needs_yandex & (ya_status == '')"}

  # ------------------------------------------------------------------------
  # Alcohol (off-trade shops and on-trade bars / catering). Until the final
  # alcohol XLSX arrives this runs on the fourth delivery's CSV (data/raw/v4,
  # format v4_csv); the final file will be one more deliveries.tsv row.
  # ------------------------------------------------------------------------
  alcohol:
    checks: [providers, export_name, yandex, overture, foursquare, egais]
    yandex_cache: v4

    policy:
      providers: *providers
      export_name: *export_name
      yandex: &yandex_v4
        near_m: 150.0
        generic_m: 60.0
        name_min: 72.0
        contractor_status_found: "Найдено"
        # The v4 CSV carries no contractor Yandex check; kept for the Policy.
        contractor_miss_text: "по адресу есть организация, но с другим названием"
        label: "Яндекс"
        label_contractor_miss: "Яндекс (подрядчик)"
      overture: *overture
      foursquare: *foursquare
      # The v4 join (checks/egais.py, mode v4): one outlet per shop across BOTH
      # risk layers, so alcohol and tobacco share match_group "v4" in
      # deliveries.tsv and are matched together. Members of a group must
      # carry the same egais policy (the workflow checks it).
      egais: &egais_v4
        mode: v4
        learn: true # fascia -> holder INN pairs learned from the alcohol layer
        exclusive: true # one outlet per shop, both layers together
        brand_rule: true # a known chain holds only its own holders' licences
        params: *licmatch_params

    existence:
      min_sources: 2
      count: {identity: [strong], record_state: [current]}
      never_count: [export]
      groups:
        - {label: "OSM", column: src_osm, sources: [osm]}
        - {label: "2GIS", column: src_gis, sources: [2gis]}
        - {label: "Яндекс", column: src_yandex, sources: [yandex], checks: [yandex, yandex_contractor]}
        - {label: "Overture", column: src_overture, sources: [overture]}
        - {label: "Foursquare", column: src_fsq, sources: [fsq]}
        # A licence counts only when it is the object's own, in force, and the
        # name agrees (alias, a learned pair passing leave-one-out, or the
        # names themselves); an own licence won on the address alone is weak
        # and goes after « || » (checks/egais.py, `name_agrees`).
        - {label: "ЕГАИС", column: src_egais, sources: [egais]}
      exclude:
        - {source: overture, only: [foursquare], ignore: [overture], sep: "|"}

    reasons: &reasons_v4
      pro_sep: " | "
      group_sep: "; "
      con_intro: " || против/не найдено: "
      con_sep: "; "
      no_sources: "источников нет"
      con_order: [yandex, egais, overture, foursquare]

    query: &query_v4
      group: "Яндекс"
      column: needs_yandex
      skip_checks: []

    how: &how_v4
      column: yandex_how
      sep: "; "
      parts:
        - check: yandex
          key: yandex_status
          texts:
            present: "наша проверка: есть"
            closed: "наша проверка: закрыт"
            ambiguous: "наша проверка: не опознан"
            absent: "наша проверка: нет"
            error: "наша проверка: ошибка"

    derived:
      ya_closed: "ya_status == 'closed'"

    # As catering, plus the licence join's shop: records within 50 m naming one
    # brand, which the join already treats as one (licmatch `entity`).
    merge: &merge_v4
      column: merged
      pairs: [{check: relink, field: relink_object}]
      shared: [{check: egais, field: egais_entity}]
      disagree: "; у {n} склеенных объектов решение объекта отличается от решения хотя бы одной записи"

    # «Алкоголь?» -- does the object's own description say it sells or serves
    # alcohol. A grocery or a café is neither yes nor no: it may, and the
    # contractor's «Возможная …» tier is exactly that guess.
    kind:
      column: alcohol
      reasons_column: alcohol_reasons
      vote_identity: [strong]
      votes:
        - {scheme: ru_text, checks: [export_name], keep_empty: true}
        - {scheme: yandex_rubric, label: "Яндекс, рубрика"}
        - {scheme: fsq_category}
        - {scheme: overture_category}
        # The object's own licence in force (name agreeing: strong): the state
        # licenses exactly this trade here.
        - {scheme: egais_activity, label: "ЕГАИС, своя действующая лицензия", record_state: [current]}
      words: {"yes": "да", "no": "нет", vending: "автомат", conflict: "противоречие", none: "нет данных"}
      schemes:
        # ORDER IS THE RULE: places that never sell alcohol first (a pharmacy
        # tagged «алкоголь» is a false positive), then alcohol words, then
        # trades unrelated to food and drink.
        ru_text: &alcohol_ladder
          lower: true
          ladder:
            - ["no", '\bаптек|\bмедицин|\bклиник|\bстоматолог|\bдетск|\bшкол|\bгимназ|\bколледж|\bхрам|\bцерк|\bсобор']
            - - "yes"
              - '(?<!без)алкогол|алко(?!гол)|вино|вина\b|винн|винот|винлаб|пиво|пив[нао]|разливн|крафт|бар\b|\bбар|паб\b|ликёр|ликер|виски|коньяк|водк|напитк|бристоль|красное.{0,3}белое|ароматный мир|beer|wine|liquor|\bpub\b|\bbar\b'
            - - "no"
              - '\bодежд|\bобув|\bцвет|\bкниг|\bканцел|\bремонт|\bсалон|\bпарикмах|\bбанк(?!ет)|\bпочт(?:а|ы|е|у|ой|ою|ам|ами|ах)?\b|\bоптик|\bювелир|\bзоо|\bавтозапчаст|\bшиномонтаж|\bавтосервис|\bстройматериал|\bмебел|\bэлектроник|\bсотов|\bсвязь|\bофис|\bагентств|\bбюро'
        yandex_rubric: *alcohol_ladder
        fsq_category:
          split: "|"
          any_yes: 'Liquor|Wine|Beer|Brewery|Distillery|Winery|Bar\b|Pub|Night ?club|Lounge|Cocktail'
          all_no_top: &fsq_not_shop [Health and Medicine, Community and Government, Business and Professional Services, Landmarks and Outdoors]
        overture_category:
          lower: false
          ladder:
            - ["yes", 'liquor|wine|beer|brewery|winery|distillery|\bbar\b|_bar|pub|night_club|lounge|cocktail']
            - ["no", &overture_not_shop 'pharmacy|clinic|hospital|dentist|doctor|school|bank|clothing|shoe|beauty|hair|automotive|car_repair']
        egais_activity:
          ladder:
            - ["yes", '.+']

    deliver:
      suffix: "_подтверждено"
      sheet: data
      legend_sheet: "Подтверждение"
      front:
        - {title: "Подтверждено", column: confirmed, width: 14}
        - {title: "Основания", column: reasons, width: 70}
        - {title: "Алкоголь?", column: alcohol, width: 14}
      appended_width: 22
      appended: &appended_v4
        - ["Источников", n_sources]
        - ["Источники", sources]
        - ["Вид: основания", alcohol_reasons]
        - ["Торговля (на вынос / на месте)", trade]
        - ["Тип подрядчика (Direct / Inferred)", evidence]
        - ["ЕГАИС: статус", licence_status]
        - ["ЕГАИС: лицензия", licence_no]
        - ["ЕГАИС: владелец", licence_org_name]
        - ["ЕГАИС: имя совпало", licence_name_agrees]
        - ["ЕГАИС: основание имени", licence_name_basis]
        - ["ЕГАИС: адрес лицензии", licence_outlet_address]
        - ["ЕГАИС: закреплена за", licence_claimed_by]
        - ["Яндекс: как засчитан", yandex_how]
        - ["Яндекс (наша): статус", ya_status]
        - ["Яндекс (наша): название", ya_name]
        - ["Яндекс (наша): адрес", ya_address]
        - ["Яндекс (наша): карточка", ya_url]
        - ["Яндекс (наша): расстояние, м", ya_distance_m]
        - ["Яндекс (наша): рядом", ya_nearby]
        - ["Яндекс (наша): запрос", ya_search_url]
        - ["Яндекс (наша): дата", ya_checked]
        - ["Связанная запись", link_note]
        - ["Overture: название", ov_name]
        - ["Overture: источник", ov_dataset]
        - ["Overture: расстояние, м", ov_distance_m]
        - ["Overture: пояснение", ov_note]
        - ["Foursquare: название", fsq_name]
        - ["Foursquare: обновлено", fsq_refreshed]
        - ["Foursquare: расстояние, м", fsq_distance_m]
        - ["Foursquare: пояснение", fsq_note]
        - ["Объект №", entity]
        - ["Объект (склеен)", merged]
        - ["Подтверждено (объект)", confirmed_object]
      legend:
        - - "Подтверждено"
          - "1 — о существовании объекта говорят не менее {min_sources_genitive} независимых источников; 0 — меньше {min_sources_genitive}."
        - - "Основания"
          - "По каждому засчитанному источнику — где найден объект: ссылка на запись OSM / карточку 2GIS, карточка Яндекса, место Overture / Foursquare, лицензия ЕГАИС. Источники разделены « | ». После « || против/не найдено:» — что искали и не нашли или нашли, но не засчитали."
        - - "Что такое объект"
          - "Одна строка выгрузки — одна запись. Одна вывеска, записанная дважды, — один объект: соседняя запись другого провайдера с тем же именем («Связанная запись») или запись того же магазина по сверке с ЕГАИС (в пределах 50 м с одной вывеской). «Объект (склеен)» — наименьший «Объект №» среди записей объекта. Вердикт у каждой записи свой; «Подтверждено (объект)» объединяет свидетельства всех записей и применяется в итогах (в скобках — записи)."
        - - "Источники"
          - "OSM, 2GIS (колонка providers выгрузки), Яндекс Карты (наша проверка), Overture Maps Places, Foursquare OS Places, собственная лицензия ЕГАИС. Яндекс засчитывается один раз."
        - - "OSM / 2GIS"
          - "Флаги колонки providers. Среди OSM и 2GIS только OSM указан у {only_osm_rows} из {delivery_rows} записей ({only_osm_pct}%); {osm_zero_note} Если у объекта нет провайдера, но в пределах {providers.relink_m:.0f} м ({providers.relink_generic_m:.0f} м для безымянной вывески) стоит запись другого провайдера с тем же именем, провайдер засчитывается — колонка «Связанная запись» называет эту запись."
        - - "ЕГАИС"
          - "Реестр лицензий ФСРАР (снимок 2026-07-01). Засчитывается только собственная действующая лицензия объекта, и только когда имя совпадает: известная сеть, выученная пара «вывеска → ИНН», прошедшая проверку без собственных адресов, или сходство названий. Лицензия, закреплённая за объектом лишь по адресу или при общей вывеске («Продукты»), не засчитывается и показана после « || ». Розница (на вынос) и общепит (на месте) лицензируются раздельно: лицензия должна разрешать торговлю объекта. Один магазин — одна точка лицензии, вместе со слоем табака."
        - - "Яндекс: наша проверка"
          - "Запрос «название, город, адрес» с картой по координате объекта. Есть — организация с похожим именем (сходство ≥ {yandex.name_min:.0f}) в пределах {yandex.near_m:.0f} м ({yandex.generic_m:.0f} м для общей вывески). Закрыт — «Больше не работает»; не засчитывается. Пусто — объект не запрашивался."
        - - "Overture / Foursquare"
          - "Место с похожим именем (сходство ≥ {overture.name_min:.0f}) в пределах {overture.near_m:.0f} м, уверенность Overture ≥ {overture.conf_min}; запись Foursquare — только обновлённая с {foursquare.fresh:.4} г. и не закрытая. Место Overture, собранное только из Foursquare, засчитывается как Foursquare."
        - - "Алкоголь?"
          - "Говорит ли описание объекта о продаже или подаче алкоголя: описание 2GIS в названии (или само название), рубрика Яндекса, категории Foursquare и Overture, собственная действующая лицензия ЕГАИС. да — все высказавшиеся за; нет — все против (аптека, одежда, ремонт…); противоречие — расходятся; нет данных — продуктовый магазин или кафе без других сведений: такие могут продавать алкоголь, но описание этого не говорит."
        - - "Торговля"
          - "off-trade — на вынос (магазин), on-trade — на месте (бар, общепит). Считайте их раздельно: реестр лицензирует их раздельно, и только на вынос сравнимо с числом магазинов."
        - - "Чего нельзя утверждать"
          - "Подтверждено = 1 говорит, что объект существует, а не что он продаёт алкоголь законно или сегодня. Карточка Яндекса — не лицензия. Подтверждено = 0 — очередь для ручной проверки, а не «объекта нет». Тип подрядчика Inferred («Возможная …») — догадка по виду объекта; прямые (Direct) и выведенные считайте отдельно."

    combinations_title: "Источники объекта (комбинации):"
    summary:
      - {label: "Строк", value: rows}
      - {label: "Объектов", value: objects}
      - {label: "Подтверждено объектов", value: confirmed_objects}
      - {for: [off-trade, on-trade], label: "Объектов, {}", count: "trade == '{}'"}
      - {for: [off-trade, on-trade], label: "Подтверждено, {}", count: "confirmed.astype(bool) & (trade == '{}')"}
      - {for: [Direct, Inferred], label: "Объектов, тип подрядчика {}", count: "evidence == '{}'"}
      - {for: [Direct, Inferred], label: "Подтверждено, тип подрядчика {}", count: "confirmed.astype(bool) & (evidence == '{}')"}
      - {label: "ЕГАИС засчитан (своя действующая, имя совпало)", count: "src_egais"}
      - {label: "ЕГАИС: своя действующая лишь по адресу или общей вывеске (не засчитана)", count: "(licence_status == 'Active') & ~licence_name_agrees"}
      - {for: [Active, Archived, Taken, Other chain, Other trade, Not in registry], label: "ЕГАИС, статус {}", count: "licence_status == '{}'"}
      - {label: "Наша Яндекс-проверка: запрошено объектов", count: "ya_status != ''"}
      - {for: [present, closed, ambiguous, absent, error], label: "   {}", count: "ya_status == '{}'"}
      - {label: "Найдено в Overture (объектов)", count: "ov_match"}
      - label: "Foursquare: засчитано / найдено, но старое или закрыто (объектов)"
        counts: ["src_fsq", "(fsq_name != '') & ~src_fsq"]
      - {for: ["да", "нет", "противоречие", "автомат", "нет данных"], label: "Алкоголь? — {} (объектов)", count: "alcohol == '{}'"}
      - {for: [off-trade, on-trade], label: "Алкоголь? — да, {}", count: "(alcohol == 'да') & (trade == '{}')"}
      - {label: "Подтверждено, но Яндекс пишет «закрыт»", count: "confirmed.astype(bool) & ya_closed"}
      - {label: "Не запрошено, хотя вердикт зависит от Яндекса", count: "needs_yandex & (ya_status == '')"}

  # ------------------------------------------------------------------------
  # Tobacco. The registry has no tobacco class: ЕГАИС runs (the v4 join needs
  # both layers together) but is no source here -- not a group, not a kind
  # vote. Its alcohol licence is shown after « || » only, worded as what it
  # is: an indirect hint, never a verification. Never sum it with a direct one.
  # ------------------------------------------------------------------------
  tobacco:
    checks: [providers, export_name, yandex, overture, foursquare, egais]
    yandex_cache: v4

    policy:
      providers: *providers
      export_name: *export_name
      yandex: *yandex_v4
      overture: *overture
      foursquare: *foursquare
      egais: *egais_v4

    existence:
      min_sources: 2
      count: {identity: [strong], record_state: [current]}
      never_count: [export, egais]
      groups:
        - {label: "OSM", column: src_osm, sources: [osm]}
        - {label: "2GIS", column: src_gis, sources: [2gis]}
        - {label: "Яндекс", column: src_yandex, sources: [yandex], checks: [yandex, yandex_contractor]}
        - {label: "Overture", column: src_overture, sources: [overture]}
        - {label: "Foursquare", column: src_fsq, sources: [fsq]}
      exclude:
        - {source: overture, only: [foursquare], ignore: [overture], sep: "|"}

    reasons: *reasons_v4
    query: *query_v4
    how: *how_v4
    derived:
      ya_closed: "ya_status == 'closed'"
    merge: *merge_v4

    kind:
      column: tobacco
      reasons_column: tobacco_reasons
      vote_identity: [strong]
      votes:
        - {scheme: ru_text, checks: [export_name], keep_empty: true}
        - {scheme: yandex_rubric, label: "Яндекс, рубрика"}
        - {scheme: fsq_category}
        - {scheme: overture_category}
      words: {"yes": "да", "no": "нет", vending: "автомат", conflict: "противоречие", none: "нет данных"}
      schemes:
        # ORDER IS THE RULE: places that never sell tobacco first, then
        # tobacco / nicotine words, then unrelated trades. A grocery or a
        # kiosk may sell cigarettes and says nothing either way.
        ru_text: &tobacco_ladder
          lower: true
          ladder:
            - ["no", 'аптек|медицин|клиник|стоматолог|детск|школ|гимназ|колледж|храм|церк|собор']
            - - "yes"
              - 'табак|табач|сигар|сигарет|вейп|вейпшоп|vape|кальян|hookah|никотин|снюс|smoke|дым|tobacco|iqos|электронн\w* сигарет'
            - - "no"
              - 'одежд|обув|цвет|книг|канцел|ремонт|салон|парикмах|банк(?!ет)|почт|оптик|ювелир|зоо|автозапчаст|шиномонтаж|автосервис|стройматериал|мебел|электроник|сотов|связь|офис|агентств|бюро|ресторан|столов'
        yandex_rubric: *tobacco_ladder
        fsq_category:
          split: "|"
          any_yes: 'Tobacco|Smoke Shop|Vape|Hookah|Cigar'
          all_no_top: *fsq_not_shop
        overture_category:
          lower: false
          ladder:
            - ["yes", 'tobacco|vape|hookah|smoke|cigar']
            - ["no", *overture_not_shop]

    deliver:
      suffix: "_подтверждено"
      sheet: data
      legend_sheet: "Подтверждение"
      front:
        - {title: "Подтверждено", column: confirmed, width: 14}
        - {title: "Основания", column: reasons, width: 70}
        - {title: "Табак?", column: tobacco, width: 14}
      appended_width: 22
      appended:
        - ["Источников", n_sources]
        - ["Источники", sources]
        - ["Вид: основания", tobacco_reasons]
        - ["Тип подрядчика (Direct / Inferred)", evidence]
        - ["Алкогольная лицензия: довод (не проверка табака)", licence_evidence]
        - ["Алкогольная лицензия ЕГАИС", licence_no]
        - ["Алкогольная лицензия: владелец", licence_org_name]
        - ["Алкогольная лицензия: статус", licence_status]
        - ["Яндекс: как засчитан", yandex_how]
        - ["Яндекс (наша): статус", ya_status]
        - ["Яндекс (наша): название", ya_name]
        - ["Яндекс (наша): адрес", ya_address]
        - ["Яндекс (наша): карточка", ya_url]
        - ["Яндекс (наша): расстояние, м", ya_distance_m]
        - ["Яндекс (наша): рядом", ya_nearby]
        - ["Яндекс (наша): запрос", ya_search_url]
        - ["Яндекс (наша): дата", ya_checked]
        - ["Связанная запись", link_note]
        - ["Overture: название", ov_name]
        - ["Overture: источник", ov_dataset]
        - ["Overture: расстояние, м", ov_distance_m]
        - ["Overture: пояснение", ov_note]
        - ["Foursquare: название", fsq_name]
        - ["Foursquare: обновлено", fsq_refreshed]
        - ["Foursquare: расстояние, м", fsq_distance_m]
        - ["Foursquare: пояснение", fsq_note]
        - ["Объект №", entity]
        - ["Объект (склеен)", merged]
        - ["Подтверждено (объект)", confirmed_object]
      legend:
        - - "Подтверждено"
          - "1 — о существовании объекта говорят не менее {min_sources_genitive} независимых источников; 0 — меньше {min_sources_genitive}."
        - - "Основания"
          - "По каждому засчитанному источнику — где найден объект. После « || против/не найдено:» — что искали и не нашли или нашли, но не засчитали, в том числе алкогольная лицензия ЕГАИС."
        - - "Что такое объект"
          - "Одна строка выгрузки. Одна вывеска, записанная дважды, — один объект: соседняя запись другого провайдера с тем же именем («Связанная запись») или запись того же магазина по сверке с ЕГАИС (в пределах 50 м с одной вывеской). «Объект (склеен)» — наименьший «Объект №» среди записей объекта. Вердикт у каждой записи свой; «Подтверждено (объект)» объединяет свидетельства всех записей и применяется в итогах (в скобках — записи)."
        - - "Источники"
          - "OSM, 2GIS (колонка providers выгрузки), Яндекс Карты (наша проверка), Overture Maps Places, Foursquare OS Places. ЕГАИС источником не является: табачного реестра в нём нет."
        - - "Алкогольная лицензия"
          - "Если у объекта своя действующая розничная алкогольная лицензия (probable), это косвенный довод: алкоголь и табак продаются через один прилавок. Он не подтверждает ни существование объекта, ни продажу табака и не засчитывается. weak — своя лицензия архивная или нерозничная, довода нет. Не складывайте probable с прямыми подтверждениями алкоголя."
        - - "OSM / 2GIS"
          - "Флаги колонки providers. Соседняя запись другого провайдера с тем же именем в пределах {providers.relink_m:.0f} м ({providers.relink_generic_m:.0f} м для безымянной вывески) даёт провайдера — колонка «Связанная запись»."
        - - "Яндекс: наша проверка"
          - "Запрос «название, город, адрес» с картой по координате объекта; есть — организация с похожим именем (сходство ≥ {yandex.name_min:.0f}) в пределах {yandex.near_m:.0f} м ({yandex.generic_m:.0f} м для общей вывески). Пусто — объект не запрашивался."
        - - "Overture / Foursquare"
          - "Место с похожим именем (сходство ≥ {overture.name_min:.0f}) в пределах {overture.near_m:.0f} м, уверенность Overture ≥ {overture.conf_min}; запись Foursquare — только обновлённая с {foursquare.fresh:.4} г. и не закрытая."
        - - "Табак?"
          - "Говорит ли описание объекта о табаке или никотине: описание 2GIS в названии (или само название), рубрика Яндекса, категории Foursquare и Overture. Продуктовый магазин или киоск без других сведений — нет данных: сигареты там могут продаваться, но описание этого не говорит. Алкогольная лицензия в этом не участвует."
        - - "Чего нельзя утверждать"
          - "У слоя табака нет независимого эталона: Подтверждено = 1 говорит только, что объект существует, а не что в нём продают табак. Алкогольная лицензия не проверяет табачную метку. Тип подрядчика Inferred («Возможная …») — догадка по виду объекта; считайте Direct и Inferred раздельно."

    combinations_title: "Источники объекта (комбинации):"
    summary:
      - {label: "Строк", value: rows}
      - {label: "Объектов", value: objects}
      - {label: "Подтверждено объектов", value: confirmed_objects}
      - {for: [Direct, Inferred], label: "Объектов, тип подрядчика {}", count: "evidence == '{}'"}
      - {for: [Direct, Inferred], label: "Подтверждено, тип подрядчика {}", count: "confirmed.astype(bool) & (evidence == '{}')"}
      - {label: "Своя действующая розничная алкогольная лицензия (probable: косвенно, не проверка, не суммировать)", count: "licence_evidence == 'probable'"}
      - {label: "Своя алкогольная лицензия архивная или нерозничная (weak)", count: "licence_evidence == 'weak'"}
      - {label: "Наша Яндекс-проверка: запрошено объектов", count: "ya_status != ''"}
      - {for: [present, closed, ambiguous, absent, error], label: "   {}", count: "ya_status == '{}'"}
      - {label: "Найдено в Overture (объектов)", count: "ov_match"}
      - label: "Foursquare: засчитано / найдено, но старое или закрыто (объектов)"
        counts: ["src_fsq", "(fsq_name != '') & ~src_fsq"]
      - {for: ["да", "нет", "противоречие", "автомат", "нет данных"], label: "Табак? — {} (объектов)", count: "tobacco == '{}'"}
      - {label: "Подтверждено, но Яндекс пишет «закрыт»", count: "confirmed.astype(bool) & ya_closed"}
      - {label: "Не запрошено, хотя вердикт зависит от Яндекса", count: "needs_yandex & (ya_status == '')"}
